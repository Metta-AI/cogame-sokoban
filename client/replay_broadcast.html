  // (clock, transport and lull shading live in the shared chrome —
  // chrome_common.js: fmt / renderClock / renderTransport / renderLullSpans)

  // ---------- pov + mismatch ----------
  // With ONE seat there is nothing to select, so the POV badge and the
  // raycast lens are gone; the #fpv panel is repurposed wholesale as the
  // dead-square inset, which the appended SOKOBAN block draws.
  function renderPov(s) { return s; }

  // First-person picture-in-picture: draw the selected seat's raycast view into
  // the bottom-right inset. Wolfenstein-style — each column is one wall slice
  // whose height is inversely proportional to distance (walls are "full-screen
  // high" so an enemy running across the mouth of a lane reads as a figure
  // sweeping between wall faces), with billboarded soldiers/hearts drawn on top.
  var fpvEl = $('fpv'), fpvCanvas = $('fpv-canvas'), fpvCtx = null;

  // Drag-to-reposition the first-person inset. Grab it anywhere; we pin via
  // left/top (dropping the right/bottom anchor) and clamp inside the stage so it
  // can never be dragged off-screen. Purely a viewer convenience — no state sent.
  // Drag the inset anywhere to reposition; drag the corner grip to resize. The
  // FPV keeps a 3:2 aspect on resize. Both pin via left/top+width once used, so
  // the CSS right/bottom/aspect anchors are dropped. Purely a viewer convenience.
  (function makeFpvInteractive() {
    var grip = $('fpv-grip');
    var mode = null;                       // 'move' | 'resize' | null
    var startX = 0, startY = 0, baseLeft = 0, baseTop = 0, baseW = 0, baseH = 0;
    var FPV_ASPECT = 3 / 2, MINW = 150;

    function beginPin() {
      var rect = fpvEl.getBoundingClientRect();
      var host = (fpvEl.offsetParent || document.body).getBoundingClientRect();
      baseLeft = rect.left - host.left;
      baseTop = rect.top - host.top;
      baseW = rect.width; baseH = rect.height;
      fpvEl.classList.add('moved', 'sized');
      fpvEl.style.left = baseLeft + 'px';
      fpvEl.style.top = baseTop + 'px';
      fpvEl.style.width = baseW + 'px';
      fpvEl.style.height = baseH + 'px';
    }

    grip.addEventListener('pointerdown', function (ev) {
      if (ev.button !== 0) return;
      beginPin();
      mode = 'resize';
      startX = ev.clientX; startY = ev.clientY;
      fpvEl.classList.add('resizing');
      grip.setPointerCapture(ev.pointerId);
      ev.preventDefault(); ev.stopPropagation();
    });

    fpvEl.addEventListener('pointerdown', function (ev) {
      if (ev.button !== 0 || mode) return;
      beginPin();
      mode = 'move';
      startX = ev.clientX; startY = ev.clientY;
      fpvEl.classList.add('dragging');
      fpvEl.setPointerCapture(ev.pointerId);
      ev.preventDefault();
    });

    function onMove(ev) {
      if (!mode) return;
      var host = (fpvEl.offsetParent || document.body).getBoundingClientRect();
      if (mode === 'move') {
        var nx = baseLeft + (ev.clientX - startX);
        var ny = baseTop + (ev.clientY - startY);
        nx = Math.max(0, Math.min(nx, host.width - fpvEl.offsetWidth));
        ny = Math.max(0, Math.min(ny, host.height - fpvEl.offsetHeight));
        fpvEl.style.left = nx + 'px';
        fpvEl.style.top = ny + 'px';
      } else {
        // Grip is bottom-RIGHT: dragging right/down grows it, keeping the
        // top-LEFT corner (baseLeft, baseTop) fixed. Clamp to the host and a
        // sane min/max.
        var nw = baseW + (ev.clientX - startX);
        nw = Math.max(MINW, Math.min(nw, host.width - baseLeft, host.width * 0.9));
        var nh = nw / FPV_ASPECT;
        var maxH = host.height * 0.9;
        if (nh > maxH) { nh = maxH; nw = nh * FPV_ASPECT; }
        fpvEl.style.width = nw + 'px';
        fpvEl.style.height = nh + 'px';
        // left/top stay fixed (baseLeft, baseTop)
      }
    }
    function endAll(ev) {
      if (!mode) return;
      mode = null;
      fpvEl.classList.remove('dragging', 'resizing');
      try { fpvEl.releasePointerCapture(ev.pointerId); } catch (e) {}
      try { grip.releasePointerCapture(ev.pointerId); } catch (e) {}
    }
    fpvEl.addEventListener('pointermove', onMove);
    grip.addEventListener('pointermove', onMove);
    fpvEl.addEventListener('pointerup', endAll);
    fpvEl.addEventListener('pointercancel', endAll);
    grip.addEventListener('pointerup', endAll);
    grip.addEventListener('pointercancel', endAll);
  })();

  // Column distance can be a scalar stone hit or a [stoneHit, glassDist] pair
  // (glass is see-through, so it rides in front of the stone behind it).
  function colStone(c) { return (c instanceof Array) ? c[0] : c; }
  function colGlass(c) { return (c instanceof Array) ? c[1] : -1; }

  // --- raycaster projection constants (real FPS math) ---
  // A world object of height WALL_H at perpendicular distance d projects to
  // (PROJ * WALL_H / d) screen px, where PROJ = (W/2)/tan(halfFov). This is the
  // exact pinhole-camera relation Wolf3D/DOOM use, so near walls tower and far
  // walls shrink smoothly — real depth, not a clamp. WALL_H is the corridor wall
  // height in world px; tuned so a wall ~one corridor away fills the frame.
  var FPV_WALL_H = 150;      // world px: conceptual corridor wall height
  // The camera eye sits at half a wall's height (walls are drawn centered on the
  // horizon), so the visible FLOOR at distance d is horizon + projH(FPV_EYE, d).
  // Every figure plants its feet on THAT line — no more floating at eye level.
  var FPV_EYE = FPV_WALL_H / 2;
  var FPV_COG_H = 90;        // world px: a cog stands ~0.6x a corridor wall tall
  var FPV_FOG = 900;         // px at which depth shading bottoms out to ink

  // --- paintball comet tracers (the board's design, rebuilt in 3D) ---
  // A shot is hitscan: the whole beam exists at once, so it can't literally
  // travel. The board solves this with a COMET (global.nim) and the PiP uses the
  // same visual language so the two views tell one story: a bright paintball
  // HEAD at the impact end, a thin trail fading back toward the muzzle, a muzzle
  // flash marking who fired, and a paint splat where it lands. Hits read bright;
  // misses are pre-faded.
  //
  // Here it's genuinely 3D: the server sends the beam as a polyline of
  // (bearing, range) samples, so the trail is projected point-by-point and
  // narrows with depth like everything else in the raycaster.
  var SHOT_FX_TICKS = WIRE.shotFxTicks || 12;  // sim.nim ShotFxTicks — the beam's lifetime
  var SHOT_MISS_AGE = 4;     // a miss draws this many ticks "older" (dimmer)
  var SHOT_TRAIL_FALLOFF = WIRE.shotTrailFalloff || 1.6;  // trail alpha = t^this
  var SHOT_HEAD_WORLD = 11;  // world px across the leading paintball
  var SHOT_TRAIL_WORLD = 5;  // world px thick at the impact end (tapers to muzzle)
  // Beams fly at roughly chest height, a little below the eye line.
  var SHOT_EYE_DROP = 10;    // world px below eye level the beam travels
  // Perspective divides by depth, so anything at point-blank range projects
  // arbitrarily large. These cap the paint against the inset's HEIGHT so a shot
  // ending at the camera reads as a fat ball / thick streak rather than a
  // full-frame wash of colour (the visor splat is what sells a hit on YOU).
  var SHOT_MAX_HEAD_H = 0.10;    // ball radius ≤ 10% of inset height
  var SHOT_MAX_TRAIL_H = 0.06;   // trail width ≤ 6% of inset height

  // --- paint-splatter-on-hit state ---
  // Tracks the POV seat's last PAINT-hit tick (server-sent self.paintTick) so a
  // fresh paint hit fires a splat; the splat itself is a set of blobs in [0..1]
  // canvas-space with a fire TICK, faded over SPLAT_TICKS so it decays as the
  // replay plays (scrub-safe, wall-clock independent). Keyed on paintTick — NOT
  // raw hp — so the splat tracks PAINT landing on this seat (gun, grenade, and
  // spray can all stamp it) and never fires on a shield bubble eating the hit.
  var fpvPrev = { pov: -1, paint: -1, tick: -1 };
  var fpvSplat = null;
  var SPLAT_TICKS = 30;      // ~1.25s at 24fps: splat lingers then clears
  // Build ONE cohesive, cartoony paint splat: a single main gob with a few small
  // lobes hugging it (an organic outline, not a shotgun-scatter) plus a couple of
  // drips. Anchored OFF-CENTER — one of a handful of side/corner spots — so the
  // view center stays clear. Placed DETERMINISTICALLY off the fire tick (no RNG),
  // so re-scrubbing to the same tick paints the identical splat.
  function makeSplat(tick, color) {
    function rnd(i) { var x = Math.sin((tick * 13.13 + i * 7.77)) * 43758.5453; return x - Math.floor(x); }
    // Off-center anchors: four corners + two side-mids. Never the center, so the
    // action stays readable through the splash.
    var anchors = [
      { x: 0.26, y: 0.30 }, { x: 0.74, y: 0.30 },
      { x: 0.26, y: 0.70 }, { x: 0.74, y: 0.70 },
      { x: 0.20, y: 0.50 }, { x: 0.80, y: 0.50 }
    ];
    var a = anchors[Math.floor(rnd(0) * anchors.length) % anchors.length];
    var mainR = 0.15 + rnd(1) * 0.04;
    var blobs = [{ x: a.x, y: a.y, r: mainR, drip: 0.8 + rnd(2) * 0.5 }];
    // 3–4 satellite lobes hugging the main gob so the silhouette reads as ONE
    // torn splat, not many separate hits.
    var count = 3 + Math.floor(rnd(3) * 2);
    for (var i = 0; i < count; i++) {
      var ang = rnd(i * 3 + 4) * Math.PI * 2;
      blobs.push({
        x: a.x + Math.cos(ang) * mainR * (0.7 + rnd(i * 3 + 5) * 0.5),
        y: a.y + Math.sin(ang) * mainR * (0.6 + rnd(i * 3 + 6) * 0.5),
        r: mainR * (0.32 + rnd(i * 3 + 7) * 0.34),
        drip: rnd(i * 5 + 8) * 0.7
      });
    }
    return { tick: tick, color: color, blobs: blobs, cx: a.x, cy: a.y, mainR: mainR };
  }

  function renderMismatch(s) {

  // ============================================================
  //  Beats → surfaces  (§5)
  // ============================================================
  function applyEvent(e, s) {
    // PAINTBALL: every beat goes through the appended game block, which draws
    // LABELLED, CLICKABLE buttons on the scrubber (pbBeat) instead of
    // chrome_common's unlabelled div markers. When the block handles a kind
    // it returns true, so the classic switch never doubles it; classic
    // replays never enter this branch at all.
    if (SK_READY && window.SokobanChrome &&
        window.SokobanChrome.event(e, s, PB_CTX)) {
      beatPulse();
      return;
    }
    switch (e.k) {
      case 'kill': onKill(e, s); markBeat(e.t, 'kill', killMarkerTeam(e, s)); beatPulse(); break;
      case 'steal': onSteal(e, s); markBeat(e.t, 'steal', e.flag); beatPulse(); break;
      case 'return': onReturn(e, s); markBeat(e.t, 'return', e.flag); beatPulse(); break;
      case 'capture': recordCapHeart(e); onCapture(e, s); markBeat(e.t, 'capture', captureTeam(s, e)); beatPulse(); break;
      case 'respawn': /* board rematerialize handles this visually */ break;
      case 'gameover': /* end-card is state-driven */ break;
      case 'phase': /* clock caption handles phase */ break;
    }
  }

  // Slots already drawn as the partner of a provable same-tick trade, so the
  // second half of the pair is suppressed (one linked row, not two). Keyed by
  // "tick:victimSlot"; a tiny ring is plenty since only same-tick pairs matter.
  var tradeConsumed = {};
  function onKill(e, s) {
    var killer = e.killer, victim = e.victim;
    var victimTeam = teamOf(s, victim);
    var killerTeam = killer >= 0 ? teamOf(s, killer) : null;
    var glyph = '▸';
    var badge = '';
    if (e.trade !== undefined && e.trade >= 0) {
      // Provable mutual trade: the server proved these two killed each other
      // this tick (the two killers ARE the two victims). Draw ONE linked row
      // with both names; skip the partner's own event so it isn't doubled.
      if (tradeConsumed[e.t + ':' + victim]) { delete tradeConsumed[e.t + ':' + victim]; return; }
      tradeConsumed[e.t + ':' + e.trade] = true;
      var row = document.createElement('div');
      row.className = 'feed-row';
      row.innerHTML = '<span class="who ' + (victimTeam || '') + '">' + esc(shortName(rosterName(s, victim))) + '</span>' +
        '<span class="glyph">⇄</span>' +
        '<span class="who ' + (teamOf(s, e.trade) || '') + '">' + esc(shortName(rosterName(s, e.trade))) + '</span>' +
        '<span class="badge">traded</span>';
      pushFeed(row);
      return;
    }
    var row = document.createElement('div');
    row.className = 'feed-row';
    if (e.amb) {
      // Same-tick multi-kill the sim can't pair (a 3-way pileup or two
      // independent kills). Attribution is honestly unknown (F7): show the
      // victim with a neutral marker, never a fabricated killer or "traded".
      badge = '<span class="badge">double KO</span>';
      row.innerHTML = '<span class="who ' + (victimTeam || '') + '">' + esc(shortName(rosterName(s, victim))) + '</span>' + badge;
    } else {
      if (e.tk) { badge = '<span class="badge tk">team kill</span>'; row.classList.add('flagkill'); }
      var killerName = killer >= 0 ? shortName(rosterName(s, killer)) : 'the arena';
      row.innerHTML = '<span class="who ' + (killerTeam || '') + '">' + esc(killerName) + '</span>' +
        '<span class="glyph">' + glyph + '</span>' +
        '<span class="who ' + (victimTeam || '') + '">' + esc(shortName(rosterName(s, victim))) + '</span>' + badge;
    }
    pushFeed(row);
  }

  function onSteal(e, s) {
    var heartTeam = e.flag; // the team whose heart was TAKEN (e.flag is the legacy event field)
    banner(String(heartTeam).toUpperCase() + ' HEART TAKEN', 'steal accent ' + heartTeam);

  function onReturn(e, s) {

  // also escapes the double-quote, which this page's old copy dropped.)

  // ---------- kill feed queue (fixed reserve, dwell floor) ----------
  var feedEl = $('killfeed');
  var MAX_FEED = 4;
  function pushFeed(row) {
    feedEl.insertBefore(row, feedEl.firstChild);
    while (feedEl.children.length > MAX_FEED) feedEl.removeChild(feedEl.lastChild);
    // Dwell floor (lever 2): a wall-clock minimum so the row reads even at 16×.
    var hold = dwellFloor('feed');
    // animFactor cap (lever 1): the slide-in duration never dips below its
    // read-time, so the row still overshoots-and-settles legibly at high speed.
    row.style.animationDuration = (250 / animFactor()) + 'ms';
    setTimeout(function () {
      if (row.parentNode) { row.classList.add('leaving'); setTimeout(function () { if (row.parentNode) row.parentNode.removeChild(row); }, 300); }
    }, hold);
  }
  function clearFeed() { feedEl.innerHTML = ''; }

  // ---------- banner lane queue (one at a time, min hold) ----------
  var bannerEl = $('bannerlane');

  var bannerBusy = false;
  function banner(text, cls) {
    bannerQueue.push({ text: text, cls: cls });
    pumpBanner();
  }
  function pumpBanner() {
    if (bannerBusy || !bannerQueue.length) return;
    bannerBusy = true;
    var b = bannerQueue.shift();
    var chip = document.createElement('div');
    chip.className = 'banner-chip ' + b.cls;
    chip.textContent = b.text;
    bannerEl.appendChild(chip);
    // lever 1 (animFactor cap): the pop-in never plays faster than 2x, so a
    // fast-forward scrub can't reduce a banner to a subliminal flash.
    chip.style.animationDuration = (300 / animFactor()) + 'ms';
    var hold = dwellFloor('banner'); // lever 2: wall-clock dwell floor (~1.9s)
    setTimeout(function () {
      chip.classList.add('leaving');
      setTimeout(function () {
        if (chip.parentNode) chip.parentNode.removeChild(chip);
        bannerBusy = false;
        pumpBanner();
      }, 260);
    }, hold);
  }
  function clearBanners() {
    bannerQueue = [];
    bannerEl.innerHTML = '';
    bannerBusy = false;
  }

  // (scrubber beat markers — markBeat / killMarkerTeam / renderBeatMarkers —
  // live in the shared chrome — chrome_common.js)

  // (momentum graph — recordMomentum / renderMomentum and their state —
  // lives in the shared chrome — chrome_common.js)

  // ============================================================
  //  End-card (§5/§8) — the END SEGMENT: verdict, win condition and match
  //  stats, held on screen by the server for ~10s before a looping restart.
  //  Reads isDraw BEFORE winner (F4); names the key (F3).
  // ============================================================
  function overLives(o, team) {
    // A team's final lives from the verdict frame: the team-keyed map when
    // present, else the legacy red/blue scalars.
    if (o.teams && o.teams[team]) return o.teams[team].lives || 0;
    return team === 'red' ? (o.redLives || 0) : team === 'blue' ? (o.blueLives || 0) : 0;
  }

  function endcardWinCondition(o, teams) {
    // The condition CHIP: how the match ended, in two or three words.
    // (A time-limit ending is always a draw in the current rules — the sim's
    // checkMaxTicks path never crowns a winner — so timeLimit only pairs
    // with draw here.)
    if (o.endRule !== undefined) {
      // PAINTBALL names the RULE the server actually applied, so the chip can
      // never disagree with the endRule in results.json.
      switch (o.endRule) {
        case 'wipe': return o.draw ? 'MUTUAL WIPE' : 'WIPE';
        case 'mercy': return 'MERCY — LEAD BEYOND THE CLOCK';
        case 'wall_clock': return 'WALL-CLOCK STOP';
        case 'sim_fault':
        case 'host_error': return 'FAULT — NO RESULT';
        default: return o.draw ? 'FULL TIME — DEAD EVEN' : 'FULL TIME ON THE HILL';
      }
    }
    if (o.draw) return o.timeLimit ? 'TIME LIMIT — DRAW' : 'DRAW';
    var losers = teams.filter(function (t) { return t !== o.winner; });
    var bestLoser = 0;
    losers.forEach(function (t) { bestLoser = Math.max(bestLoser, overLives(o, t)); });
    return bestLoser <= 0 ? 'ELIMINATION' : 'HEART CAPTURE';
  }

  function endcardOrder(a, b) {
    // Kills lead the board; fewer deaths, then captures, break ties.
    return (b.k || 0) - (a.k || 0) || (a.d || 0) - (b.d || 0) ||
      (b.cap || 0) - (a.cap || 0) || a.s - b.s;
  }

  function endcardBadge(cls, count, title) {
    // One honor icon; repeat events fold into a ·N suffix instead of stacking.
    if (!count) return '';
    return '<span class="ec-badge ' + cls + '" title="' + title + '">' +
      (count > 1 ? '·' + count : '') + '</span>';
  }

  // Which hearts each seat captured, keyed by join slot: fed by the up-front
  // beat timeline (replays ship every capture on the first HUD frame) and by
  // live capture events, deduped by tick|slot so the two paths never
  // double-count one capture (a loop restart re-fires both, harmlessly).
  var capHeartsBySlot = {};
  var capHeartsSeen = {};
  function recordCapHeart(e) {
    if (e.by == null || e.by < 0 || !e.flag) return;
    var key = e.t + '|' + e.by;
    if (capHeartsSeen[key]) return;
    capHeartsSeen[key] = true;
    (capHeartsBySlot[e.by] = capHeartsBySlot[e.by] || []).push(e.flag);
  }
  function ingestCapHearts(s) {
    if (!s.beats) return;
    for (var i = 0; i < s.beats.length; i++) {
      if (s.beats[i].k === 'capture') recordCapHeart(s.beats[i]);
    }
  }

  function capturedHeartHtml(heartTeam) {
    // One captured heart, drawn as the captured team's own heart art (its
    // baked pixel art); a team without baked art gets a tinted glyph.
    if (heartTeam === 'red' || heartTeam === 'blue' ||
        heartTeam === 'green' || heartTeam === 'yellow') {
      return '<span class="ec-heart ' + heartTeam + '" title="Captured the ' + heartTeam + ' heart"></span>';
    }
    return '<span class="ec-heart-glyph" title="Captured an enemy heart">♥</span>';
  }

  function capturedHeartsHtml(s, p) {
    // The Cap column renders EVERY captured heart, one per capture — a 4-team
    // match (GV32: a capture eliminates its team and play continues) can see
    // one seat retire two or three rival hearts. The beat timeline names each
    // heart; when it can't (older servers ship no beats), fall back to the
    // roster's capture count, colored as the enemy heart only when two teams
    // make that unambiguous.
    var caps = p.cap || 0;
    if (caps <= 0) return '';
    var flags = capHeartsBySlot[p.s] || [];
    if (flags.length < caps) {
      var teams = activeTeams(s);
      var enemy = teams.length === 2 ? (teams[0] === p.team ? teams[1] : teams[0]) : null;
      flags = [];
      for (var i = 0; i < caps; i++) flags.push(enemy);
    }
    return flags.map(capturedHeartHtml).join('');
  }

  function renderEndcardRows(s, team, el, mvpSlot) {
    // Final per-player stat lines, top killer first. The MVP (winning team's
    // best line) reads in amber — no star prefix, it would break the name
    // column's alignment. Clstr counts grenade/spray multi-kill events; the
    // Cap column renders each captured heart itself, one per capture, in the
    // captured team's color; a dagger icon marks
    // teammate kills. A mixed team (2+ policies) groups its rows under policy
    // subheaders so each policy's contribution reads separately.
    var rows = (s.roster || []).filter(function (p) { return p.team === team; })
      .slice().sort(endcardOrder);
    var pols = teamPolicies(s, team);
    var grouped = pols.length > 1 && pols.length <= 4;
    var html = '';
    function rowHtml(p) {
      var mvp = mvpSlot != null && p.s === mvpSlot;
      if (PB_MODE) {
        // PAINTBALL: the row is a COG (its anonymous alias), and the columns
        // are tags dealt, tags taken and what its squad painted. Kills and
        // captures are not the score here and never appear as one.
        var pbMarks = endcardBadge('bs', p.tk, 'Friendly fire — tagged a teammate');
        var tr = (s.teams || {})[p.team] || {};
        return '<div class="ec-row' + (mvp ? ' mvp' : '') + '">' +
          '<span class="pcell">' +
          '<span class="pname">' + esc(p.alias || shortName(rosterName(s, p.s))) + '</span>' +
          pbMarks +
          '</span>' +
          '<span class="n">' + (p.k || 0) + '</span>' +
          '<span class="n">' + (p.d || 0) + '</span>' +
          '<span class="n clstr">' + (tr.paint || 0) + '</span>' +
          '</div>';
      }
      var marks = endcardBadge('bs', p.tk, 'Backstab — killed a teammate');
      var cluster = (p.mk2 || 0) + (p.mk3 || 0);
      return '<div class="ec-row' + (mvp ? ' mvp' : '') + '">' +
        '<span class="pcell">' +
        '<span class="pname">' + esc(shortName(rosterName(s, p.s))) + '</span>' +
        marks +
        '</span>' +
        '<span class="n">' + (p.k || 0) + '</span>' +
        '<span class="n">' + (p.d || 0) + '</span>' +
        '<span class="n clstr">' + (cluster > 0 ? cluster : '') + '</span>' +
        '<span class="n cap">' + capturedHeartsHtml(s, p) + '</span>' +
        '</div>';
    }
    if (grouped) {
      pols.forEach(function (pol) {
        html += '<div class="ec-pol">' + esc(teamHeadline(pol)) + '</div>';
        rows.forEach(function (p) {
          var pp = p.pol != null ? p.pol : stripSeatSuffix(p.name);
          if (pp === pol) html += rowHtml(p);
        });
      });
    } else {
      rows.forEach(function (p) { html += rowHtml(p); });
    }
    el.innerHTML = html;
  }

  // Rebuild the endcard's per-team stat panels when the active team set
  // changes (once per match in practice): one panel per team, in display order.
  var ecTeams = null;
  function ensureEndcardTeams(teams) {
    var key = teams.join(',') + (PB_MODE ? '|pb' : '');
    if (ecTeams === key) return;
    ecTeams = key;
    var wrap = $('ec-teams');
    wrap.innerHTML = '';
    teams.forEach(function (team) {
      var el = document.createElement('div');
      el.className = 'ec-team';
      el.id = 'ec-team-' + team;
      el.innerHTML = PB_MODE
        ? '<div class="ec-tname ' + team + '" id="ec-tname-' + team + '">' + team.toUpperCase() + '</div>' +
          '<div class="ec-lives">' +
          '<span class="fl-num ' + team + '" id="ec-' + team + '">0:00</span>' +
          '<span class="fl-cap">Pushes made</span>' +
          '</div>' +
          '<div class="ec-thead"><span>Cog</span><span>Solved</span><span>Pushes</span><span>Score</span></div>' +
          '<div id="ec-rows-' + team + '"></div>'
        : '<div class="ec-tname ' + team + '" id="ec-tname-' + team + '">' + team.toUpperCase() + '</div>' +
          '<div class="ec-lives">' +
          '<span class="fl-num ' + team + '" id="ec-' + team + '">0</span>' +
          '<span class="fl-cap">Levels solved</span>' +
          '</div>' +
          '<div class="ec-thead"><span>Level</span><span>Tier</span><span>Result</span><span>Moves</span><span>Crates</span></div>' +
          '<div id="ec-rows-' + team + '"></div>';
      wrap.appendChild(el);
    });
  }

  function renderEndcard(s) {
    var card = $('endcard');
    if (!s.over) return;
    card.classList.add('on'); // own the frame at GameOver (§8) — before either verdict branch
    var o = s.over;
    var teams = activeTeams(s);
    ensureEndcardTeams(teams);

    // The loop countdown ticks every second while everything else is frozen,
    // so it renders unconditionally; the static content is keyed and only
    // rebuilt when the verdict frame actually changes (24fps hold, no churn).
    $('ec-replay').innerHTML = s.lp && s.hold > 0
      ? 'Replaying in <b>' + s.hold + '</b>' : '';

    var key = [s.mx, o.winner, o.draw, o.timeLimit, (s.roster || []).length].join('|');
    if (card._key === key) return;
    card._key = key;

    var head = $('ec-headline'), how = $('ec-how');
    $('ec-wincond').textContent = endcardWinCondition(o, teams);

    // MVP: the winning team's best final line (kills > fewer deaths >
    // captures — the capturer keeps their ⚑ mark, the star follows the guns).
    // A draw crowns nobody — the fidelity rules never invent a distinction the
    // sim didn't make (F4).
    var mvpSlot = null;
    if (!o.draw) {
      var winners = (s.roster || []).filter(function (p) { return p.team === o.winner; })
        .sort(endcardOrder);
      if (winners.length) mvpSlot = winners[0].s;
    }
    teams.forEach(function (team) {
      $('ec-' + team).textContent = PB_MODE
        ? fmt(team === 'red' ? (o.hillRed || 0) : (o.hillBlue || 0))
        : overLives(o, team);
      $('ec-tname-' + team).textContent = teamName(s, team, team.toUpperCase());
      $('ec-team-' + team).classList.toggle('win', !o.draw && o.winner === team);
      renderEndcardRows(s, team, $('ec-rows-' + team), mvpSlot);
    });

    if (PB_MODE) {
      // PAINTBALL: the verdict names the rule the server applied and always
      // states both banked hill clocks.
      var hillLine = 'RED holds ' + fmt(o.hillRed || 0) + ' — BLUE ' +
        fmt(o.hillBlue || 0) + ' · game ' + (o.game || 1) + '/' + (o.games || 1) +
        ' · ' + String(o.regime || '').toUpperCase();
      if (o.draw) {
        head.className = 'headline draw';
        head.textContent = 'DEAD EVEN';
        how.textContent = hillLine +
          ' — both squads banked the same hill time, so this half scores 0.500 each.';
        return;
      }
      var pbWinner = o.winner;
      var pbWinName = teamName(s, pbWinner, String(pbWinner).toUpperCase());
      head.className = 'headline ' + pbWinner;
      head.textContent = pbWinName + ' WINS';
      switch (o.endRule) {
        case 'wipe':
          head.textContent = pbWinName + ' WIPES THE FIELD';
          how.textContent = hillLine +
            ' — the other squad ran out of cogs, so the survivor was credited' +
            ' every remaining tick.';
          break;
        case 'mercy':
          how.textContent = hillLine +
            ' — the lead was bigger than the clock left, so the rules ended it.';
          break;
        case 'wall_clock':
          how.textContent = hillLine +
            ' — the engine hit its wall-clock budget and scored the half from' +
            ' the hill counts at that tick.';
          break;
        default:
          how.textContent = hillLine + ' — full time on the hill clock.';
      }
      return;
    }

    if (o.draw) {
      head.className = 'headline draw';
      head.textContent = 'DRAW — NO SCORE';
      how.textContent = o.timeLimit
        ? 'Time expired before a capture or a wipe — a scoreless draw, with no tiebreak on lives.'
        : 'The match ended with neither side scoring — no winner.';
      return;
    }

    var winner = o.winner;
    var winName = teamName(s, winner, String(winner).toUpperCase());
    head.className = 'headline ' + winner;
    head.textContent = winName + ' WINS';

    var losers = teams.filter(function (t) { return t !== winner; });
    var winL = overLives(o, winner);
    var bestLoser = 0;
    losers.forEach(function (t) { bestLoser = Math.max(bestLoser, overLives(o, t)); });

    if (o.timeLimit) {
      // Time-limit resolution — name the key and the values (F3).
      if (winL !== bestLoser) {
        how.textContent = 'Time expired — ' + winName + ' held more lives (' + winL + ' vs ' + bestLoser + ').';
      } else {
        how.textContent = 'Time expired — lives tied; ' + winName + ' won on heart progress.';
      }
    } else {
      if (bestLoser <= 0) {
        head.textContent = losers.length === 1
          ? winName + ' WIPES OUT ' +
            teamName(s, losers[0], String(losers[0]).toUpperCase())
          : winName + ' WIPES THE FIELD';
        how.textContent = winName + ' eliminated every opposing life.';
      } else {
        how.textContent = winName + ' captured the enemy heart.';
      }
    }
  }

  // ============================================================
  //  Transport wiring — DOM controls emit the legacy chat chars +
  //  the ctf-side s:/v: whole-string commands.
  // ============================================================
  function togglePlay() { send(' '); }
  // (speed chips + their speed→command map live in the shared chrome)
  $('btn-play').addEventListener('click', togglePlay);
  $('btn-restart').addEventListener('click', function () { send(','); });
  $('btn-back').addEventListener('click', function () { send('b'); });
  $('btn-fwd').addEventListener('click', function () { send('.'); });
  $('btn-end').addEventListener('click', function () { send('e'); });
  $('btn-loop').addEventListener('click', function () { send('r'); });
  $('btn-skip').addEventListener('click', function () { send('f'); });

  // click-to-seek: map x-fraction to a tick and send s:<tick>
  // Map an x-fraction of the scrubber onto the shown [startTick, maxTick] axis
  // and seek there. One place, shared by a live click and by a click that had
  // to wait for the first frame.
  function seekToFraction(s, frac) {
    var st = Math.max(0, s.st || 0);
    var mx = Math.max(st + 1, s.mx || 1);
    send('s:' + (st + Math.round(frac * (mx - st))));
  }

  $('scrub').addEventListener('click', function (ev) {
    var rect = this.getBoundingClientRect();
    var frac = Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width));
    // The axis lives on the frame, so a click before the first frame cannot be
    // mapped yet — QUEUE it (onFrame flushes SEEK_FRAC) rather than dropping
    // it. A dropped first click is invisible: the board is already drawn, the
    // transport looks alive, and the viewer just does not move.
    if (!lastState || !lastState.en) { SEEK_FRAC = frac; return; }
    seekToFraction(lastState, frac);
  });

  // pov clear (togglePov lives in the shared chrome, driven via ctx.sendPov)

  // keyboard shortcuts mirror the transport
  window.addEventListener('keydown', function (ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var k = ev.key;
    if (k === ' ') { ev.preventDefault(); togglePlay(); }
    else if (k === ',' || k === '<') send(',');
    else if (k === '.' || k === '>') send('.');
    else if (k === 'b') send('b');
    else if (k === 'e') send('e');
    else if (k === 'r') send('r');
    else if (k === 'f') send('f');
    else if (k === '+' || k === '=') send('+');
    else if (k === '-' || k === '_') send('-');
    else if (k === 'o') setSpoilers(!getSpoilers());
    else if (k >= '1' && k <= '9') send(k);
    // keydown never crosses the iframe boundary: relay Esc to the league
    // shell, which relays it on to the Observatory theater host.
    else if (k === 'Escape') postToShell('esc');
  });

  // Click a soldier on the board to select it (mirrors the squad-pip lens, but
  // for anyone visible on the arena). The board canvas draws ONLY the zoomable
  // map layer, letterboxed by broadcast_core; chrome (scoreboard, transport) are
  // HTML overlays, so a canvas click is always a MAP-space click. Invert the
  // core's letterbox transform to recover native map pixels, then hand them to
  // clickMap — the server hit-tests the soldier footprint and toggles selection.
  // ---- zoom + pan -------------------------------------------------------
  // A generated board can be 4992px square; letterboxed whole into a ~760px
  // stage that is 0.15x, where a cog is a single pixel. So the board has to be
  // enterable — but NOT by scrolling. A trackpad two-finger scroll and a mouse
  // wheel are how you move the PAGE, and a viewer that eats them zooms the
  // board every time someone tries to scroll past it. The gestures that mean
  // "zoom" and nothing else are: pinch (trackpad and touchscreen), the +/-
  // buttons and slider, and the z/x keys. Drag pans, arrows nudge, double-click
  // (or 0, or the slider at rest) refits.
  // The transform lives in broadcast_core, so click-to-select below inverts the
  // SAME numbers and keeps hitting what you actually clicked at any zoom.
  var dragging = false, dragMoved = 0, lastDragX = 0, lastDragY = 0;
  function canvasPoint(ev) {
    var rect = canvas.getBoundingClientRect();
    return { x: ev.clientX - rect.left, y: ev.clientY - rect.top, ok: rect.width > 0 };
  }

  // A trackpad PINCH reaches a browser as a wheel event with ctrlKey set (no
  // ctrl key is actually held) — that, and only that, is the wheel we take.
  // Everything else falls through to the page exactly as if the board were an
  // image. preventDefault on this one also suppresses the browser's own
  // ctrl+wheel page zoom, which would otherwise fight the board zoom.
  var gesturing = false, gestureZoom = 1, gestureAt = null;
  canvas.addEventListener('wheel', function (ev) {
    if (!ev.ctrlKey || gesturing) return;
    ev.preventDefault();
    var p = canvasPoint(ev);
    if (!p.ok) return;
    var unit = ev.deltaMode === 1 ? 16 : (ev.deltaMode === 2 ? 100 : 1);
    core.zoomAt(Math.exp(-ev.deltaY * unit * 0.012), p.x, p.y);
  }, { passive: false });

  // Safari reports the same trackpad pinch as gesture events instead, with an
  // absolute scale factor from the gesture's start; `gesturing` keeps the two
  // paths from both firing on browsers that send both.
  canvas.addEventListener('gesturestart', function (ev) {
    ev.preventDefault();
    gesturing = true;
    var t = core.getTransform();
    gestureZoom = (t && t.zoom) || 1;
    gestureAt = canvasPoint(ev);
  });
  canvas.addEventListener('gesturechange', function (ev) {
    ev.preventDefault();
    if (!gesturing || !(ev.scale > 0)) return;
    var a = gestureAt && gestureAt.ok ? gestureAt : null;
    core.setZoom(gestureZoom * ev.scale, a ? a.x : undefined, a ? a.y : undefined);
  });
  canvas.addEventListener('gestureend', function (ev) {
    ev.preventDefault();
    gesturing = false;
  });

  // Touchscreen pinch. #board's touch-action leaves one-finger panning to the
  // page while it is fitted (so the board never traps a scroll) and takes it
  // back once zoomed in, where a drag has somewhere to go; pinch-zoom is never
  // in that list, so a second finger always arrives here as a pointer.
  var pinch = new Map();          // pointerId -> {x, y}
  var pinchSpan = 0, pinchMidX = 0, pinchMidY = 0;
  function pinchGeometry() {
    var pts = Array.from(pinch.values());
    var dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
    return {
      span: Math.max(1, Math.hypot(dx, dy)),
      midX: (pts[0].x + pts[1].x) / 2,
      midY: (pts[0].y + pts[1].y) / 2
    };
  }
  function beginPinch() {
    var g = pinchGeometry();
    pinchSpan = g.span;
    pinchMidX = g.midX;
    pinchMidY = g.midY;
    dragging = false;             // two fingers is a pinch, not a drag
  }

  function syncTouchAction(t) {
    // Fitted: the page owns one-finger drags. Zoomed: the board does.
    canvas.style.touchAction = (t && t.zoom > 1) ? 'none' : 'pan-x pan-y';
  }

  canvas.addEventListener('pointerdown', function (ev) {
    if (ev.pointerType === 'touch') {
      pinch.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pinch.size === 2) { beginPinch(); return; }
      if (pinch.size > 2) return;
    }
    if (ev.button !== 0) return;
    dragging = true;
    dragMoved = 0;
    lastDragX = ev.clientX;
    lastDragY = ev.clientY;
  });
  window.addEventListener('pointermove', function (ev) {
    if (pinch.has(ev.pointerId)) {
      pinch.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pinch.size === 2) {
        var g = pinchGeometry();
        var rect = canvas.getBoundingClientRect();
        // Zoom by how much the fingers spread, then pan by how far the pair
        // travelled, so the board tracks the hand instead of only the spread.
        core.zoomAt(g.span / pinchSpan, g.midX - rect.left, g.midY - rect.top);
        core.panBy(g.midX - pinchMidX, g.midY - pinchMidY);
        pinchSpan = g.span;
        pinchMidX = g.midX;
        pinchMidY = g.midY;
        dragMoved = 999;          // a pinch must never also select a cog
        return;
      }
    }
    if (!dragging) return;
    var dx = ev.clientX - lastDragX, dy = ev.clientY - lastDragY;
    lastDragX = ev.clientX;
    lastDragY = ev.clientY;
    dragMoved += Math.abs(dx) + Math.abs(dy);
    core.panBy(dx, dy);
    var t = core.getTransform();
    canvas.style.cursor = t && t.zoom > 1 ? 'grabbing' : '';
  });
  function endPointer(ev) {
    if (ev && pinch.has(ev.pointerId)) {
      pinch.delete(ev.pointerId);
      if (pinch.size === 2) beginPinch();
    }
    dragging = false;
    canvas.style.cursor = '';
  }
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);

  canvas.addEventListener('dblclick', function (ev) {
    ev.preventDefault();
    core.resetView();
  });

  canvas.addEventListener('click', function (ev) {
    // A pan is not a click: dragging the board must never also select the cog
    // that happened to be under the pointer when the drag ended.
    if (dragMoved > 4) { dragMoved = 0; return; }
    var rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    // getBoundingClientRect is CSS px; the core's transform lives in the same
    // CSS space (offsetX/offsetY/scale are computed against clientWidth/Height,
    // NOT the dpr-scaled backing store), so no devicePixelRatio factor here.
    var cssX = ev.clientX - rect.left;
    var cssY = ev.clientY - rect.top;
    var t = core.getTransform();
    if (!t || !t.scale) return;
    var mapX = Math.round((cssX - t.offsetX) / t.scale);
    var mapY = Math.round((cssY - t.offsetY) / t.scale);
    // Ignore clicks in the letterbox bands (outside the drawn map).
    if (mapX < 0 || mapY < 0 || mapX >= t.nativeW || mapY >= t.nativeH) return;
    core.clickMap(mapX, mapY);
  });

  // ============================================================
  //  Fixed-aspect fit: size the composition to the board's native aspect
  //  inside the embed box, then scale the whole thing (board + overlays) as
  //  one unit. Chrome sizes off the STAGE width, so overlays stay locked to
  //  the graphics at any container shape (§2, L82 bounded-embed).
  // ============================================================
  function relayout() {
    var boxW = viewport.clientWidth, boxH = viewport.clientHeight;
    if (!boxW || !boxH) return;
    // The board region (game action) fits the board aspect into the box BETWEEN a
    // reserved top band (the scorebug) and bottom band (the transport), so neither
    // ever sits over play. Each band's pixel height depends on --hudscale (→ board
    // width) and the board fit depends on the bands, so iterate to a FIXED POINT:
    // stop as soon as a pass measures the same bands it was laid out with. Two
    // passes settle a container resize, but a MAP-ASPECT change (the 1.874:1
    // arena → a square four-team board) swings --hudscale far enough that the
    // second pass is still reserving the old bands, which would leave the board
    // a couple of percent off its true aspect — visible as thin dead strips.
    var scorebug = document.getElementById('scorebug');
    var transport = document.getElementById('transport');
    var root = document.documentElement;
    var topBand = parseFloat(getComputedStyle(root).getPropertyValue('--topband')) || 0;
    var band = parseFloat(getComputedStyle(root).getPropertyValue('--band')) || 0;
    var stageW = 0, stageH = 0;
    for (var pass = 0; pass < 4; pass++) {
      var prevTop = topBand, prevBand = band;
      var availH = Math.max(1, boxH - topBand - band);
      var boardW, boardH;
      if (boxW / availH > BOARD_ASPECT) {
        boardH = availH; boardW = Math.round(availH * BOARD_ASPECT);
      } else {
        boardW = boxW; boardH = Math.round(boxW / BOARD_ASPECT);
      }
      stageW = boardW; stageH = boardH + topBand + band;
      stage.style.width = stageW + 'px';
      stage.style.height = stageH + 'px';
      // One scale for the whole composition: chrome was authored against a
      // ~760px-wide reference board, so --hudscale is the board's on-screen width
      // over that reference (clamped so a huge featured embed doesn't bloat the
      // chrome and a tiny 360px floor stays legible).
      var scale = Math.max(0.5, Math.min(1.6, boardW / 760));
      root.style.setProperty('--hudscale', scale.toFixed(3));
      stage.classList.toggle('tiny', boardW <= 620);
      // Measure each band's natural height → reserve exactly that.
      topBand = scorebug ? scorebug.offsetHeight : 0;
      band = transport ? transport.offsetHeight : 0;
      root.style.setProperty('--topband', topBand + 'px');
      root.style.setProperty('--band', band + 'px');
      if (Math.abs(topBand - prevTop) < 0.5 && Math.abs(band - prevBand) < 0.5) break;
    }
    core.setViewportFit();
  }
  var ro = new ResizeObserver(relayout);
  ro.observe(viewport);
  window.addEventListener('resize', relayout);

  // The context the appended PAINTBALL block reads the classic chrome
  // through. Declared here (hoisted `var`, so onFrame sees it however early
  // the first frame lands) rather than duplicating any of it: the game block
  // must not re-implement naming, escaping, feed insertion or the transport.
  PB_CTX = {
    $: $, C: C, esc: esc, fmt: fmt, send: send,
    teamCol: teamCol, activeTeams: activeTeams, teamOf: teamOf,
    teamName: teamName, rosterName: rosterName, shortName: shortName,
    pushFeed: pushFeed, banner: banner, togglePov: togglePov,
    getState: function () { return lastState; }
  };
  if (window.SokobanChrome) window.SokobanChrome.install(PB_CTX);

  relayout();
  core.start();
})();
</script>
<!-- ============================================================

<script>
(function () {
  'use strict';
  // The dead-square hatch is drawn at a HIGHER-CONTRAST alpha under .tiny: a
  // 12 px cell cannot carry a subtle wash.
  var HATCH_ALPHA = 0.18, HATCH_ALPHA_TINY = 0.26;
  var TIER_LABEL = { unfiltered: 'UNFILTERED', medium: 'MEDIUM', hard: 'HARD' };

  var ctx = null;
  var beatsDrawn = false;
  var lastFeedTick = -1;
  // The offending crate's cell and the tick the deadlock fired on. The BOARD
  // cannot carry this: it is composited in the Worker from the sim's own
  // packet, and a deadlock ENDS the level on the tick it happens, so the
  // board is already the next level a frame later. The dead-square inset is
  // this block's own canvas and exists for exactly this geometry, so the ring
  // and the two flashes live there, alongside the #bannerlane call and the
  // tallest, reddest beat on the scrubber.
  var deadFlash = null;
  var FLASH_TICKS = 24;   // ~2 s at 12 ticks/s, two flashes of six ticks each

  function skEl(id) { return document.getElementById(id); }

  function skEnsureNodes() {
    var stage = skEl('stage');
    if (!stage || skEl('sk-ribbon')) return;
    var ribbon = document.createElement('div');
    ribbon.id = 'sk-ribbon';
    ribbon.innerHTML = '<div class="sk-main">LEVEL 1/6</div>' +
      '<div class="sk-sub">MOVE 0/200</div>';
    stage.appendChild(ribbon);
    var pips = document.createElement('div');
    pips.id = 'sk-pips';
    stage.appendChild(pips);

  // The beat builder. Named skBeat, NEVER markBeat: the chrome alias block
  // declares `var markBeat = C.markBeat`, and a same-named function
  // declaration here would be hoisted over by it. Every marker is a real
  // <button> with a title and an aria-label, and it seeks on click.
  function skBeat(tick, kind, label, startTick, maxTick) {
    var scrub = skEl('scrub');
    if (!scrub) return;
    var span = Math.max(1, maxTick - startTick);
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'beat-marker ' + kind;
    b.style.left = (Math.min(1, Math.max(0, (tick - startTick) / span)) * 100) + '%';
    b.title = label;
    b.setAttribute('aria-label', label);
    b.__tick = tick;
    b.addEventListener('click', function (ev) {
      ev.stopPropagation();
      if (ctx && ctx.send) ctx.send('s:' + tick);
    });
    scrub.appendChild(b);
  }

  function skDrawBeats(s) {
    if (beatsDrawn || !s.sok_beats) return;
    beatsDrawn = true;
    var st = Math.max(0, s.st || 0);
    var mx = Math.max(st + 1, s.mx || 1);
    for (var i = 0; i < s.sok_beats.length; i++) {
      var b = s.sok_beats[i];
      skBeat(b.t, b.k, b.label, st, mx);
    }

  // ---- the scorebug plate ------------------------------------------------
  // Only the CONTENTS of the inherited plate change: the plate, the sides, the
  // clock column and #plates-r (kept, rendered empty, because it is one of the
  // scorebug's three flex columns and removing it would un-centre #clock) are
  // the starter's.
  function skPlate(s, g) {

    if (name) {

      name.title = g.name || '';

    // A seven-digit score is wider than a 360 px plate column, so at .tiny the
    // numeral is the solve count and the score stays in the clock caption.
    var tiny = document.getElementById('stage').classList.contains('tiny');
    var num = skEl('lives-red');
    if (num) {
      num.textContent = tiny ? g.solved + '/' + g.level.of : String(g.score);
    }
    var label = document.querySelector('#plates-l .solved-label');
    if (label) label.textContent = tiny ? 'Solved' : 'Score';
    var chips = skEl('flag-red');
    if (chips) {
      var alias = chips.parentElement &&
        chips.parentElement.querySelector('.sk-alias');
      var kids = chips.querySelectorAll('.crate-chip');
      for (var i = 0; i < kids.length; i++) {
        kids[i].classList.toggle('on', i < (g.level && g.level.placed || 0));
      }

        if (row) {

          tag.className = 'sk-alias';
          tag.textContent = g.alias.toUpperCase();
          row.insertBefore(tag, row.firstChild);

      if (g.fallbackTurns > 0 && !fb) {

          var mark = document.createElement('span');
          mark.className = 'sk-fallback';
          mark.textContent = '\u21af';
          mark.title = g.fallbackTurns + ' fallback turn(s)';

  // ---- the clock ---------------------------------------------------------

    if (big) big.textContent = 'SOLVED ' + g.solved + '/' + g.level.of;
    if (cap) {
      cap.textContent = 'weight ' + g.weight + '/' + g.maxWeight +
        ' \u00b7 move ' + g.level.move + '/' + g.level.budget +
        ' \u00b7 score ' + g.score;
    }
  }

  // ---- the level ribbon and the six pips --------------------------------
  function skRibbon(g) {
    var ribbon = skEl('sk-ribbon');
    if (!ribbon) return;
    var tier = TIER_LABEL[g.level.tier] || '';
    var full = 'LEVEL ' + g.level.index + '/' + g.level.of +
      (tier ? ' \u00b7 ' + tier : '') +
      (g.level.opt ? ' \u00b7 SOLVABLE IN ' + g.level.opt + ' PUSHES' : '');

    ribbon.querySelector('.sk-main').textContent =
      'LEVEL ' + g.level.index + '/' + g.level.of + (tier ? ' \u00b7 ' + tier : '');
    ribbon.querySelector('.sk-sub').textContent =
      (g.level.opt ? g.level.opt + ' PUSHES \u00b7 ' : '') +
      'MOVE ' + g.level.move + '/' + g.level.budget;
  }

  function skPips(g) {
    var host = skEl('sk-pips');
    if (!host) return;
    var levels = g.levels || [];
    if (host.childNodes.length !== levels.length) {
      host.innerHTML = '';
      for (var i = 0; i < levels.length; i++) {
        var pip = document.createElement('span');
        pip.className = 'sk-pip';
        pip.innerHTML = '<span class="sk-pipcap"></span>';
        host.appendChild(pip);

    }
    for (var k = 0; k < levels.length; k++) {
      var lv = levels[k];
      var node = host.childNodes[k];
      var cls = 'sk-pip t-' + lv.tier;
      if (lv.outcome === 'solved') cls += ' solved';
      else if (lv.outcome === 'deadlocked') cls += ' deadlocked';
      else if (lv.outcome === 'outofsteps') cls += ' outofsteps';
      if (k === g.level.index - 1 && g.level.active) cls += ' cur';

        (TIER_LABEL[lv.tier] || '') + ' \u00b7 ' +
        (lv.outcome === 'running' ? 'in play' : lv.outcome);
      node.firstChild.textContent = (TIER_LABEL[lv.tier] || '?').charAt(0);

  // ---- the dead-square inset (the repurposed #fpv panel) ----------------
  // The same 10 x 10 grid stripped to walls, marked squares, dead squares and
  // crates, so the geometry of the trap is legible even when the main board is
  // busy. Every glyph it draws is a CHIP, never text, so nothing can be laid
  // out at a negative coordinate (--strict-text-bounds stays on).
  function skInset(g, tick) {
    var panel = skEl('fpv'), canvas = skEl('fpv-canvas');
    if (!panel || !canvas) return;
    var rows = g.board && g.board.rows;
    if (!rows || !rows.length) { panel.classList.remove('sk-on'); return; }
    panel.classList.add('sk-on');
    var name = skEl('fpv-name');
    if (name) {
      name.textContent = g.alias.toUpperCase() + ' \u00b7 ' +
        (g.level.placed || 0) + ' OF 4 PARKED';
    }
    var dpr = window.devicePixelRatio || 1;
    var cssW = canvas.clientWidth || 84, cssH = canvas.clientHeight || 84;
    var w = Math.max(1, Math.round(cssW * dpr));
    var h = Math.max(1, Math.round(cssH * dpr));
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
    var c = canvas.getContext('2d');
    var n = rows.length;
    var cell = Math.floor(Math.min(w, h) / n);
    var ox = Math.floor((w - cell * n) / 2), oy = Math.floor((h - cell * n) / 2);
    c.clearRect(0, 0, w, h);
    c.fillStyle = '#16110d';
    c.fillRect(0, 0, w, h);
    var tiny = document.getElementById('stage').classList.contains('tiny');
    var dead = {};
    var list = (g.board && g.board.dead) || [];
    for (var d = 0; d < list.length; d++) dead[list[d][0] + ',' + list[d][1]] = 1;
    for (var y = 0; y < n; y++) {
      for (var x = 0; x < rows[y].length; x++) {
        var px = ox + x * cell, py = oy + y * cell;
        var ch = rows[y][x];
        if (ch === '#') {
          c.fillStyle = '#4a3b2c';
          c.fillRect(px, py, cell, cell);
          continue;
        }
        c.fillStyle = '#241a12';
        c.fillRect(px, py, cell, cell);
        if (dead[x + ',' + y]) {
          c.fillStyle = 'rgba(224,82,58,' + (tiny ? HATCH_ALPHA_TINY : HATCH_ALPHA) + ')';
          c.fillRect(px, py, cell, cell);
        }
        if (ch === '.' || ch === '*' || ch === '+') {
          c.fillStyle = '#e8a33d';
          c.fillRect(px + cell * 0.32, py + cell * 0.32, cell * 0.36, cell * 0.36);
        }
        if (ch === '$' || ch === '*') {
          c.fillStyle = ch === '*' ? '#45a85e' : '#a4713c';
          c.fillRect(px + cell * 0.15, py + cell * 0.15, cell * 0.7, cell * 0.7);
        }
        if (ch === '@' || ch === '+') {
          c.fillStyle = '#3f7cc4';
          c.beginPath();
          c.arc(px + cell / 2, py + cell / 2, Math.max(1, cell * 0.3), 0, 6.2832);
          c.fill();
        }
      }
    }
    // THE DEADLOCK FLASH: the offending crate ringed in red, flashing twice.
    if (deadFlash && tick >= deadFlash.t &&
        tick - deadFlash.t <= FLASH_TICKS) {
      var on = Math.floor((tick - deadFlash.t) / 6) % 2 === 0;
      if (on) {
        var rx = ox + deadFlash.x * cell, ry = oy + deadFlash.y * cell;
        var lw = Math.max(1, Math.round(cell * 0.16));
        c.strokeStyle = '#e0523a';
        c.lineWidth = lw;
        c.strokeRect(rx + lw / 2, ry + lw / 2, cell - lw, cell - lw);
      }
    }
  }

  // ---- the endcard -------------------------------------------------------
  // It stops at var(--band) (the starter's own rule, kept) so the scrubber
  // stays clickable underneath, and every seek dismisses it (the starter's
  // `else { $('endcard').classList.remove('on'); }` path, kept).
  function skEndcard(s, g) {
    var card = skEl('endcard');
    if (!card) return;
    card.classList.add('on');
    var head = skEl('ec-headline');
    if (head) {
      head.className = 'headline ' + (g.win ? 'red' : 'draw');
      head.textContent = g.solved + ' OF ' + g.level.of + ' SOLVED';
    }
    var cond = skEl('ec-wincond');
    if (cond) {
      cond.textContent = 'WEIGHT ' + g.weight + ' OF ' + g.maxWeight +
        ' \u00b7 PAR ' + g.parWeight + (g.win ? ' MET' : ' MISSED');
    }
    var how = skEl('ec-how');
    if (how) {
      how.textContent = g.pushesTotal + ' pushes, ' + g.blockedMoves +
        ' blocked moves, ' + g.deadlocks + ' deadlock' +
        (g.deadlocks === 1 ? '' : 's') + ', ' + g.outOfSteps +
        ' out of steps, ' + g.fallbackTurns + ' fallback turn' +
        (g.fallbackTurns === 1 ? '' : 's') + ' \u00b7 SCORE ' + g.score;
    }
    var wrap = skEl('ec-teams');
    if (!wrap) return;
    var key = 'sk|' + g.solved + '|' + g.score + '|' + g.level.of;
    if (wrap.__key === key) return;
    wrap.__key = key;
    var html = '<div class="ec-team win" id="ec-team-red">' +
      '<div class="ec-tname red" id="ec-tname-red">' + skEscape(g.name) +
      '</div>' +
      '<div class="ec-lives"><span class="fl-num red" id="ec-red">' +
      g.solved + '</span><span class="fl-cap">Levels solved</span></div>' +
      '<div class="ec-thead"><span>Level</span><span>Tier</span>' +
      '<span>Result</span><span>Moves</span><span>Crates</span></div>' +
      '<div id="ec-rows-red">';
    var levels = g.levels || [];
    for (var i = 0; i < levels.length; i++) {
      html += '<div class="ec-row"><span class="n">' + (i + 1) + '</span>' +
        '<span class="n">' + (TIER_LABEL[levels[i].tier] || '') + '</span>' +
        '<span class="n">' + levels[i].outcome + '</span>' +
        '<span class="n">' + levels[i].moves + '</span>' +
        '<span class="n">' + levels[i].placed + '</span></div>';
    }
    wrap.innerHTML = html + '</div></div>';
  }

  function skEscape(text) {
    return String(text == null ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // ---- the match feed ----------------------------------------------------
  // Plain language, never internal notation. Routed through the inherited
  // pushFeed so the feed queue, its cap and its styling stay the starter's.
  // The inherited `pushFeed` takes a NODE, not a string — a signature drift
  // here is exactly what latched static_replay.js into `failed` mid-replay on
  // cogball 0.1.4, so the row is built the way the starter's own callers build
  // it and handed over unchanged.
  function skFeed(text, cls) {
    if (!ctx || !ctx.pushFeed) return;
    var row = document.createElement('div');
    row.className = 'feed-row' + (cls ? ' ' + cls : '');
    row.innerHTML = '<span class="who">' + skEscape(text) + '</span>';
    ctx.pushFeed(row);
  }

  function skOnEvent(e, s) {
    var g = s.sok;
    if (!g) return false;
    switch (e.k) {
      case 'levelstart':
        skFeed('LEVEL ' + (e.i + 1) + ' OF ' + g.level.of + ' \u2014 ' +
          (TIER_LABEL[e.tier] || '') + ', SOLVABLE IN ' + e.optPushes +
          ' PUSHES');
        if (ctx && ctx.banner) {
          ctx.banner('LEVEL ' + (e.i + 1) + ' \u2014 ' +
            (TIER_LABEL[e.tier] || '') + ' \u00b7 ' + e.optPushes + ' PUSHES');
        }
        return true;
      case 'boxon':
        skFeed('CRATE PARKED \u2014 ' + e.placed + ' OF 4');
        return true;
      case 'boxoff':
        skFeed('CRATE PUSHED OFF ITS MARKED SQUARE \u2014 ' + e.placed + ' OF 4');
        return true;
      case 'plan':
        skFeed('TURN ' + e.n + ' \u2014 ' + e.actions + ' ACTIONS, ' +
          e.moves + ' MOVES' + (e.truncated ? ', PLAN CUT OFF' : '') +
          (e.unreachable ? ', ' + e.unreachable + ' UNREACHABLE' : ''));
        return true;
      case 'say':
        skFeed(g.alias + ': \u201c' + e.text + '\u201d', 'say');
        return true;
      case 'fallback':
        // The cause is what tells a spectator WHY the model lost the turn -
        // a timeout reads very differently from a parse error.
        skFeed('MISSED THE CALL \u2014 pusher plan' +
          (e.cause && e.cause !== 'fallback' ? ' (' + e.cause + ')' : ''));
        return true;
      case 'deadlock':
        deadFlash = { x: e.x, y: e.y, t: (e.t === undefined ? s.t : e.t) };
        skFeed('DEADLOCK CREATED \u2014 CRATE ' + e.box + ' CORNERED AT (' +
          e.x + ',' + e.y + ')', 'bad');
        if (ctx && ctx.banner) {
          ctx.banner('DEADLOCK CREATED \u2014 CRATE CORNERED AT (' +
            e.x + ',' + e.y + ')');
        }
        return true;
      case 'solved':
        skFeed('LEVEL ' + (e.i + 1) + ' SOLVED IN ' + e.moves + ' MOVES / ' +
          e.pushes + ' PUSHES', 'good');
        return true;
      case 'failed':
        skFeed('LEVEL ' + (e.i + 1) + ' LOST \u2014 ' +
          (e.why === 'deadlocked' ? 'DEADLOCKED' : 'OUT OF STEPS'), 'bad');
        return true;
      case 'budget':
        skFeed('BUDGET GUARD \u2014 SCRIPTED FROM TURN ' + e.turn);
        return true;
      case 'end':
        skFeed('FINAL \u2014 ' + e.solved + ' OF ' + e.of + ' SOLVED, WEIGHT ' +
          e.weight + '/' + e.maxWeight);
        return true;
      default:
        return false;
    }
  }

  window.SokobanChrome = {
    install: function (context) {
      ctx = context;
      skEnsureNodes();
    },
    frame: function (s, context, jumped) {
      ctx = context || ctx;
      // A seek re-derives the world from scratch, so a flash from the tick
      // we left behind must not survive it.
      if (jumped) { deadFlash = null; }
      var g = s && s.sok;
      if (!g) return;
      try {
        skEnsureNodes();
        skDrawBeats(s);
        skPlate(s, g);
        skClock(s, g);
        skRibbon(g);
        skPips(g);
        skInset(g, s.t);
        if (s.ph === 'gameover') skEndcard(s, g);
      } catch (err) {
        // A chrome error must never latch static_replay.js into `failed`
        // mid-replay (the cogball 0.1.4 scar): report it and keep drawing.
        if (window.console) console.error('sokoban chrome:', err);
      }
      lastFeedTick = s.t;
    },
    event: function (e, s, context) {
      ctx = context || ctx;
      try {
        return skOnEvent(e, s);
      } catch (err) {
        if (window.console) console.error('sokoban chrome event:', err);
        return false;
      }
    }
  };
})();
</script>
</body>
</html>
