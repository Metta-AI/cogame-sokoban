<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sokoban renderer fixture</title>
<style>
  /* The same face the shipped page loads, from the same directory, so the
     mirror canvas below measures the LLM text in the font it was really laid
     out in rather than in a fallback. */
  @font-face {
    font-family: 'rajdhani';
    src: url('./font.ttf') format('truetype');
    font-display: block;
  }
  html, body { margin: 0; background: #0b0704; color: #f2e8d8;
    font: 12px system-ui, sans-serif; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; }
  .cell { border: 1px solid #3a2c1e; }
  .cell iframe, .cell canvas { border: 0; display: block; }
  .cap { padding: 2px 4px; color: #8a7f72; letter-spacing: 0.08em; }
</style>
</head>
<body>
<!--
  The worst-case renderer fixture.

  tools/ci/docker_smoke.sh runs with NO ANTHROPIC_API_KEY, so the seat in the
  CI replay plays scripted and a scripted baseline emits NO `say` and NO
  `notes` at all: every replay CI produces carries zero LLM text, and nothing
  that plays a replay can draw the chrome that shows it (the cogchemists
  2026-08-24 scar).

  This fixture therefore LOADS THE SHIPPED BUNDLE'S OWN index.html in an
  iframe and shims only the frame source - it does not re-implement the
  drawing (the particle-worlds 2026-08-26 scar). The real page, the real
  chrome_common.js, the real broadcast_core.js and the real appended SOKOBAN
  block all run; this page just hands them a frame that CI's own replay can
  never contain: a full-cap 140-rune `say`, a fully hatched dead-square board,
  a DEADLOCK CREATED banner, all six level-pip states, all three tier names
  and a deadlocked endcard - at 360 px, 640 px and 1280 px.

  IT THEN CHECKS WHAT WAS DRAWN, two ways, because this viewer renders its
  BOARD inside a Worker's OffscreenCanvas and its TEXT in the DOM, and
  viewer_smoke.mjs only sees main-thread 2D `fillText`: on the shipped bundle
  it reports `canvas_text: 0 drawn`, which by its own header "is itself the
  signal that this check did not cover it". So:

    1. ASSERTIONS. The `say` row the real page rendered must contain all 140
       runes, unshortened and un-ellipsized, and every text line the page laid
       out in the feed, the banner lane and the level ribbon must sit inside
       the frame. A failure sets data-replay-error with the offending string.

    2. A MIRROR CANVAS. Every one of those lines is re-drawn into a main-thread
       2D canvas THE SIZE OF THE FRAME, at the box and in the font the page
       gave it (per-line, so a wrapped row mirrors line for line). That is what
       gives `viewer_smoke.mjs --strict-text-bounds` something real to measure:
       a line the page pushed off the frame lands off the canvas, `never_inside`
       is nonzero and the step is red.
-->
<div class="row" id="row"></div>
<script>
(function () {
  'use strict';
  var WIDTHS = [[360, 203], [640, 360], [1280, 720]];

  // Exactly 140 runes: the server's own MaxSayRunes, so the feed row is laid
  // out at its true worst case rather than at whatever a scripted episode
  // happened to produce.
  var SAY = ('parking the two right-hand crates first, then coming back for ' +
    'the pair on the left; box0 down is dead because row 7 carries no marked ' +
    'square at all!!');
  SAY = Array.from(SAY).slice(0, 140).join('');

  var BOARD = [
    '##########',
    '#        #',
    '#  #  #  #',
    '#  .$    #',
    '#   @ $. #',
    '# #  #   #',
    '#  .$    #',
    '#     $. #',
    '#   #    #',
    '##########'
  ];

  var DEAD = [];
  for (var y = 1; y < 9; y++) {
    for (var x = 1; x < 9; x++) {
      if ((x + y) % 3 === 0) DEAD.push([x, y]);
    }
  }

  var LEVELS = [
    { i: 0, tier: 'unfiltered', opt: 9, outcome: 'solved', placed: 4,
      moves: 58, turns: 3, pushes: 12, relaxed: false },
    { i: 1, tier: 'unfiltered', opt: 11, outcome: 'deadlocked', placed: 2,
      moves: 44, turns: 3, pushes: 9, relaxed: false },
    { i: 2, tier: 'medium', opt: 17, outcome: 'outofsteps', placed: 3,
      moves: 200, turns: 10, pushes: 38, relaxed: false },
    { i: 3, tier: 'medium', opt: 20, outcome: 'solved', placed: 4,
      moves: 126, turns: 7, pushes: 21, relaxed: true },
    { i: 4, tier: 'hard', opt: 26, outcome: 'running', placed: 1,
      moves: 38, turns: 2, pushes: 5, relaxed: false },
    { i: 5, tier: 'hard', opt: 24, outcome: 'unreached', placed: 0,
      moves: 0, turns: 0, pushes: 0, relaxed: false }
  ];

  function state(phase) {
    return {
      t: 662, mt: 1200, ph: phase, lob: 0, pl: true, sp: 1, mx: 900, st: 0,
      lp: true, sk: false, ff: false, en: true, mm: -1, bs: 1, pov: -1,
      hold: 0,
      teams: { red: { lives: 2, flag: 'home', carrier: -1, prog: 0,
                      policies: ['sokoban-lookahead'] } },
      roster: [{ s: 0, team: 'red', name: 'sokoban-lookahead',
                 pol: 'sokoban-lookahead', col: 0, alive: true, lives: 0,
                 hp: 1, carry: false, k: 0, d: 0, cap: 0, mk2: 0, mk3: 0,
                 tk: 0, alias: 'Alpha', seat: 0, kind: 'llm' }],
      events: [],
      sok: {
        level: { index: 5, of: 6, tier: 'hard', tierLabel: 'HARD', opt: 26,
                 move: 38, budget: 200, pushes: 5, placed: 2, active: true },
        levels: LEVELS,
        board: { rows: BOARD, dead: DEAD },
        solved: 2, weight: 3, maxWeight: 12, parWeight: 5, score: 3170382,
        boxCredit: 14, pushesTotal: 85, blockedMoves: 47, deadlocks: 1,
        outOfSteps: 1, fallbackTurns: 1, alias: 'Alpha',
        name: 'sokoban-lookahead', kind: 'llm', reason: 'complete',
        endRule: 'ladderComplete', win: false, feed: []
      },
      sok_beats: [
        { t: 0, k: 'levelstart', label: 'LEVEL 1 \u2014 UNFILTERED, SOLVABLE IN 9 PUSHES' },
        { t: 40, k: 'boxon', label: 'CRATE PARKED \u2014 1 OF 4' },
        { t: 120, k: 'solved', label: 'LEVEL 1 SOLVED IN 58 MOVES / 12 PUSHES' },
        { t: 300, k: 'deadlock', label: 'DEADLOCK CREATED \u2014 CRATE 2 CORNERED AT (7,1)' },
        { t: 340, k: 'failed', label: 'LEVEL 2 LOST \u2014 DEADLOCKED' },
        { t: 500, k: 'fallback', label: 'MISSED THE CALL \u2014 pusher plan' },
        { t: 880, k: 'end', label: 'FINAL \u2014 2 OF 6 SOLVED' }
      ],
      lead: { teams: ['red'], pts: [[0, 0], [40, 1], [120, 4], [662, 14]] },
      lulls: [[400, 470]]
    };
  }

  var SAY_EVENT = { k: 'say', t: 10, text: SAY };
  var DEADLOCK_EVENT = { k: 'deadlock', t: 30, kind: 'frozen_block',
                         box: 2, x: 7, y: 1 };

  var EVENTS = [
    { k: 'levelstart', t: 0, i: 4, tier: 'hard', optPushes: 26 },
    SAY_EVENT,
    { k: 'plan', t: 12, n: 23, moves: 20, actions: 4, truncated: true,
      dropped: 1, unreachable: 1, source: 'llm' },
    { k: 'boxon', t: 20, box: 1, x: 7, y: 4, placed: 2 },
    { k: 'boxoff', t: 24, box: 0, x: 3, y: 3, placed: 1 },
    DEADLOCK_EVENT,
    { k: 'failed', t: 31, i: 4, why: 'deadlocked' },
    { k: 'fallback', t: 32, cause: 'timeout' },
    { k: 'solved', t: 33, i: 3, moves: 126, pushes: 21, turns: 7 },
    { k: 'budget', t: 34, turn: 40, remaining_s: 30 },
    { k: 'end', t: 35, reason: 'complete', endRule: 'ladderComplete',
      solved: 2, of: 6, weight: 3, maxWeight: 12, score: 3170382 }
  ];

  // The chrome the fixture measures: the LLM's own line and the level
  // narration around it. Everything here is text the page lays out itself.
  var MEASURED = ['#killfeed', '#bannerlane', '#sk-ribbon'];

  var pending = WIDTHS.length;
  var failed = null;

  function fail(message) {
    if (!failed) failed = message;
  }

  // ---- per-LINE text runs, in the frame's own coordinates ---------------
  // A range over one character gives its line box, so consecutive characters
  // with the same top are one rendered line. That is what makes a WRAPPED row
  // mirror faithfully instead of being redrawn as one impossible line.
  function textRuns(win, root) {
    var doc = win.document;
    var runs = [];
    var walker = doc.createTreeWalker(root, 4 /* SHOW_TEXT */, null, false);
    var range = doc.createRange();
    for (var node = walker.nextNode(); node; node = walker.nextNode()) {
      var data = node.data || '';
      if (!data.trim()) continue;
      var parent = node.parentElement;
      if (!parent) continue;
      var style = win.getComputedStyle(parent);
      if (style.visibility === 'hidden' || style.display === 'none') continue;
      if (parseFloat(style.opacity) === 0) continue;
      var font = [style.fontStyle, style.fontWeight, style.fontSize,
                  style.fontFamily].join(' ');
      var current = null;
      for (var i = 0; i < data.length; i++) {
        range.setStart(node, i);
        range.setEnd(node, i + 1);
        var box = range.getBoundingClientRect();
        // Collapsed whitespace has no box; it is not drawn, so it is not
        // mirrored either.
        if (!box.width && !box.height) continue;
        if (!current || Math.abs(box.top - current.top) > 0.75) {
          current = { text: '', font: font, left: box.left, top: box.top,
                      right: box.right, bottom: box.bottom };
          runs.push(current);
        }
        current.text += data[i];
        current.right = Math.max(current.right, box.right);
        current.bottom = Math.max(current.bottom, box.bottom);
      }
    }
    return runs;
  }

  function mirror(cell, size, runs) {
    var canvas = document.createElement('canvas');
    canvas.width = size[0];
    canvas.height = size[1];
    cell.appendChild(canvas);
    var c = canvas.getContext('2d');
    c.fillStyle = '#0b0704';
    c.fillRect(0, 0, canvas.width, canvas.height);
    c.textAlign = 'left';
    c.textBaseline = 'top';
    c.fillStyle = '#f2e8d8';
    for (var i = 0; i < runs.length; i++) {
      c.font = runs[i].font;
      c.fillText(runs[i].text, runs[i].left, runs[i].top);
    }
  }

  function checkRuns(size, runs) {
    for (var i = 0; i < runs.length; i++) {
      var run = runs[i];
      if (run.left < -1 || run.top < -1 ||
          run.right > size[0] + 1 || run.bottom > size[1] + 1) {
        fail('at ' + size[0] + 'px a drawn line left the frame [' +
          Math.round(run.left) + ',' + Math.round(run.top) + ' -> ' +
          Math.round(run.right) + ',' + Math.round(run.bottom) + '] in ' +
          size[0] + 'x' + size[1] + ': ' + JSON.stringify(run.text.slice(0, 60)));
        return;
      }
    }
  }

  function bare(text) {
    return String(text).replace(/\s+/g, '');
  }

  function checkSay(win, size) {
    // The fixture's OWN string, asserted at full length: a quietly shortened
    // remark leaves every other check passing while testing nothing.
    var rows = win.document.querySelectorAll('#killfeed .feed-row.say');
    if (!rows.length) {
      fail('at ' + size[0] + 'px the say row never reached #killfeed');
      return;
    }
    var row = rows[0];   // pushFeed inserts the newest row first
    var text = row.textContent || '';
    if (bare(text).indexOf(bare(SAY)) < 0) {
      fail('at ' + size[0] + 'px the 140-rune say was shortened to ' +
        Array.from(text).length + ' runes: ' + JSON.stringify(text.slice(0, 80)));
      return;
    }
    if (text.indexOf('\u2026') >= 0) {
      fail('at ' + size[0] + 'px the say row was ellipsized: ' +
        JSON.stringify(text.slice(0, 80)));
      return;
    }
    var box = row.getBoundingClientRect();
    if (box.left < -1 || box.right > size[0] + 1 ||
        box.top < -1 || box.bottom > size[1] + 1) {
      fail('at ' + size[0] + 'px the say row is outside the frame [' +
        Math.round(box.left) + ',' + Math.round(box.top) + ' -> ' +
        Math.round(box.right) + ',' + Math.round(box.bottom) + ']');
    }
  }

  WIDTHS.forEach(function (size) {
    var cell = document.createElement('div');
    cell.className = 'cell';
    var cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = size[0] + ' x ' + size[1];
    var frame = document.createElement('iframe');
    frame.width = size[0];
    frame.height = size[1];
    frame.src = './index.html?replay=./replay.json';
    cell.appendChild(cap);
    cell.appendChild(frame);
    document.getElementById('row').appendChild(cell);

    frame.addEventListener('load', function () {
      // The bundle boots its wasm runtime asynchronously; poll for the chrome
      // hook rather than racing it.
      var tries = 0;
      var timer = setInterval(function () {
        tries++;
        var w = frame.contentWindow;
        var chrome = w && w.SokobanChrome;
        if (!chrome && tries < 120) return;
        clearInterval(timer);
        if (!chrome) {
          fail('SokobanChrome never appeared at ' + size[0] + 'px');
          finish();
          return;
        }
        // Web fonts change every metric, so nothing is measured until the
        // page's own face has loaded.
        var ready = (w.document.fonts && w.document.fonts.ready) ||
          Promise.resolve();
        // The mirror canvas draws in the page's own face, so it has to be
        // LOADED in this document too: a canvas `font` assignment kicks off
        // the fetch asynchronously and the first fillText would otherwise
        // measure a fallback.
        ready.then(function () { return document.fonts.load('16px rajdhani'); })
          .then(function () {
            drive(w, chrome, cell, size);
            finish();
          }, function () {
            drive(w, chrome, cell, size);
            finish();
          });
      }, 100);
    });
  });

  function drive(w, chrome, cell, size) {
    var runs = [];
    try {
      var playing = state('playing');
      chrome.frame(playing, null, false);
      for (var i = 0; i < EVENTS.length; i++) {
        chrome.event(EVENTS[i], playing, null);
      }
      // The inherited feed keeps four rows, so the two the fixture exists to
      // measure - the model's own line and the deadlock call - are re-issued
      // last and measured before anything can evict them.
      chrome.event(DEADLOCK_EVENT, playing, null);
      chrome.event(SAY_EVENT, playing, null);
      for (var m = 0; m < MEASURED.length; m++) {
        var root = w.document.querySelector(MEASURED[m]);
        if (root) runs = runs.concat(textRuns(w, root));
      }
      checkSay(w, size);
      checkRuns(size, runs);
      if (!runs.length) {
        fail('at ' + size[0] + 'px the page drew no measurable text at all');
      }
      chrome.frame(state('gameover'), null, false);
    } catch (err) {
      fail(String(err && err.message ? err.message : err));
    }
    // Mirrored even on failure: the artifact screenshot is most useful when
    // the step is red.
    try {
      mirror(cell, size, runs);
    } catch (err) {
      fail('mirror failed at ' + size[0] + 'px: ' + String(err));
    }
  }

  function finish() {
    pending--;
    if (pending > 0) return;
    if (failed) {
      document.documentElement.setAttribute('data-replay-error', failed);
      return;
    }
    document.documentElement.setAttribute('data-replay-loaded', 'true');
  }
})();
</script>
</body>
</html>
